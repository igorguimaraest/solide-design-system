<!doctype html>
<!-- PROTÓTIPO DESCARTÁVEL — passo 2 do STATUS.md.
     Pergunta: qual base de neutro o SOLIDE deve usar?
     Carrega o brand guide real num iframe e troca só a escala --sld-palette-neutral-*.
     Abrir com: npm run serve  →  http://localhost:8080/docs/plans/prototipo-neutros/?variant=A -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo — bases de neutro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; font-family: system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* Barra do protótipo: propositalmente fora do visual SOLIDE */
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 32px); box-sizing: border-box;
    background: #111; color: #fff; padding: 8px 12px; border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); font-size: 13px; }
  #bar button, #bar select { background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 999px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  #label { min-width: 150px; text-align: center; font-weight: 600; }
  #swatches { display: flex; gap: 2px; }
  #swatches span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #555; }
  #contrast { opacity: .8; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) {
    #bar { flex-wrap: nowrap; gap: 6px; padding: 6px 8px; bottom: 8px; font-size: 12px; }
    #bar button { padding: 6px 10px; white-space: nowrap; }
    #label { min-width: 0; white-space: nowrap; }
    #swatches, #screen, #contrast { display: none; }
  }
</style>
</head>
<body>
<iframe id="guide" src="/solide-brand-guide.html" title="Brand guide SOLIDE"></iframe>
<div id="bar">
  <button id="prev" aria-label="Variante anterior">←</button>
  <span id="label"></span>
  <button id="next" aria-label="Próxima variante">→</button>
  <span id="swatches"></span>
  <select id="screen" aria-label="Tela">
    <option value="screen-app-shell">App shell</option>
    <option value="screen-tabelas">Tabelas</option>
    <option value="screen-controles">Controles</option>
    <option value="screen-alertas">Alertas</option>
    <option value="screen-padroes-interface">Padrões de interface</option>
  </select>
  <button id="theme">Tema: claro</button>
  <span id="contrast"></span>
</div>
<script>
// Escalas geradas em OKLCH mantendo a luminosidade da escala atual (ver STATUS.md, passo 2)
const VARIANTS = {
  A: { nome: 'Neutro puro', p: {0:'#FFFFFF',50:'#F9F9F9',100:'#F0F0F0',150:'#E6E6E6',200:'#DADADA',300:'#BFBFBF',400:'#A3A3A3',500:'#878787',550:'#717171',600:'#676767',700:'#4A4A4A',750:'#373737',800:'#2C2C2C',850:'#222222',900:'#191919',950:'#111111'} },
  B: { nome: 'Quente sutil', p: {0:'#FFFFFF',50:'#F9F9F7',100:'#F1F0ED',150:'#E8E6E2',200:'#DCDAD5',300:'#C2BFBA',400:'#A6A39E',500:'#8A8782',550:'#73706C',600:'#696763',700:'#4C4A48',750:'#393735',800:'#2D2C2B',850:'#232221',900:'#1A1918',950:'#121111'} },
  C: { nome: 'Frio sutil', p: {0:'#FFFFFF',50:'#F8F9FA',100:'#EEF0F3',150:'#E4E6EA',200:'#D7DBDF',300:'#BCC0C5',400:'#A0A4A8',500:'#84888C',550:'#6E7175',600:'#65686B',700:'#494B4D',750:'#36383A',800:'#2B2C2E',850:'#222224',900:'#18191A',950:'#111112'} },
  Atual: { nome: 'Atual (referência)', p: null },
};
const params = new URLSearchParams(location.search);
// ?opcoes=A,C limita as setas a essas variantes
const filtro = (params.get('opcoes') || '').split(',').filter(k => k in VARIANTS);
const KEYS = filtro.length ? filtro : Object.keys(VARIANTS);
let variant = KEYS.includes(params.get('variant')) ? params.get('variant') : KEYS[0];
let theme = params.get('tema') === 'escuro' ? 'dark' : 'light';
let screen = params.get('tela') || 'screen-app-shell';
const frame = document.getElementById('guide');
const applied = { screen: null };

function luminance(hex) {
  const c = [1,3,5].map(i => { const v = parseInt(hex.slice(i,i+2),16)/255; return v <= 0.03928 ? v/12.92 : ((v+0.055)/1.055)**2.4; });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
const ratio = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((m, n) => n - m); return ((x + 0.05) / (y + 0.05)).toFixed(1); };

// Injeta a escala no documento e em iframes internos (ex.: prévia do UI Kit no App shell)
function inject(doc) {
  if (!doc || !doc.head) return;
  let style = doc.getElementById('prototipo-neutros');
  if (!style) { style = doc.createElement('style'); style.id = 'prototipo-neutros'; doc.head.appendChild(style); }
  const p = VARIANTS[variant].p;
  // !important garante que a troca vence a definição de :root do tokens.css
  style.textContent = p ? ':root{' + Object.entries(p).map(([k, v]) => `--sld-palette-neutral-${k}:${v} !important;`).join('') + '}' : '';
  doc.querySelectorAll('iframe').forEach(f => {
    if (!f.dataset.prototipo) { f.dataset.prototipo = '1'; f.addEventListener('load', () => { inject(f.contentDocument); syncInnerTheme(f.contentDocument); }); }
    try { inject(f.contentDocument); syncInnerTheme(f.contentDocument); } catch (e) { /* iframe de outra origem: ignora */ }
  });
}

// A prévia do UI Kit tem botão de tema próprio (não segue o guia); o protótipo clica nele para alinhar
function syncInnerTheme(doc, tentativas = 20) {
  if (!doc) return;
  const alvo = theme === 'dark' ? 'Mudar para modo escuro' : 'Mudar para modo claro';
  const btn = doc.querySelector(`button[aria-label="${alvo}"]`);
  if (btn) return btn.click();
  // Já está no tema certo (o botão oposto existe) ou a prévia ainda não renderizou: tenta de novo
  if (!doc.querySelector('button[aria-label^="Mudar para modo"]') && tentativas > 0) setTimeout(() => syncInnerTheme(doc, tentativas - 1), 200);
}

function apply() {
  const doc = frame.contentDocument;
  if (!doc || !doc.head) return;
  inject(doc);
  const win = frame.contentWindow;
  // Só reaplica tema/tela quando mudam, para o guia não exibir o toast "Tema alterado" a cada troca
  if (win.setTheme && doc.documentElement.dataset.theme !== theme) win.setTheme(theme);
  if (win.showScreen && applied.screen !== screen) { win.showScreen(screen); applied.screen = screen; }

  const cs = getComputedStyle(doc.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  document.getElementById('label').textContent = `${variant} — ${VARIANTS[variant].nome}`;
  document.getElementById('theme').textContent = 'Tema: ' + (theme === 'dark' ? 'escuro' : 'claro');
  document.getElementById('screen').value = screen;
  document.getElementById('swatches').innerHTML = [50,150,300,600,850,950].map(k => `<span title="warm-${k}" style="background:var(--x)"></span>`).join('');
  [...document.querySelectorAll('#swatches span')].forEach((s, i) => s.style.background = tok('--sld-palette-neutral-' + [50,150,300,600,850,950][i]));
  const fundo = theme === 'dark' ? tok('--sld-palette-neutral-950') : tok('--sld-palette-neutral-50');
  const sec = theme === 'dark' ? tok('--sld-palette-neutral-400') : tok('--sld-palette-neutral-600');
  document.getElementById('contrast').textContent = `texto secundário ${ratio(sec, fundo)}:1`;

  const q = new URLSearchParams({ variant, tela: screen, tema: theme === 'dark' ? 'escuro' : 'claro' });
  if (filtro.length) q.set('opcoes', filtro.join(','));
  history.replaceState(null, '', '?' + q);
}

function step(d) { variant = KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length]; apply(); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; apply(); };
document.getElementById('screen').onchange = e => { screen = e.target.value; apply(); };
const onKey = e => {
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
};
document.addEventListener('keydown', onKey);
frame.addEventListener('load', () => { frame.contentDocument.addEventListener('keydown', onKey); apply(); });
</script>
</body>
</html>
